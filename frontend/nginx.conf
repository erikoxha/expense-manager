server {
  listen 80;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options DENY;
  add_header Referrer-Policy same-origin;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'";
  location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; }
  location / { try_files $uri $uri/ /index.html; }
}
