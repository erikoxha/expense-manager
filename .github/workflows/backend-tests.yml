name: Backend tests
on:
  push:
    branches: [main, 'testing/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: expense_testing
          POSTGRES_USER: expense_testing
          POSTGRES_PASSWORD: ci-disposable-password
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U expense_testing -d expense_testing"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DJANGO_SECRET_KEY: ci-only-disposable-signing-key-not-for-deployment
      POSTGRES_DB: expense_testing
      POSTGRES_USER: expense_testing
      POSTGRES_PASSWORD: ci-disposable-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      DEBUG: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.lock
      - run: pip install -r backend/requirements-test.lock
      - run: python scripts/run_backend.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-reports-${{ github.sha }}
          path: reports/backend/
          retention-days: 30
